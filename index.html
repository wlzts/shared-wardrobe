<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>共享衣柜</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#B8860B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="共享衣柜">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <header class="top-bar">
    <div class="wardrobe-switcher" id="wardrobeSwitcher">
      <span id="currentWardrobeName">选择衣柜</span>
      <span class="arrow">▼</span>
    </div>
    <div class="sync-status" id="syncStatus" title="点击同步">
      <span class="sync-dot"></span>
    </div>
  </header>

  <main class="content" id="content"></main>

  <button class="fab" id="addClotheFab" style="display:none" title="添加衣物">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="wardrobe">
      <span class="nav-icon">👔</span>
      <span class="nav-label">衣柜</span>
    </button>
    <button class="nav-btn" data-tab="outfit">
      <span class="nav-icon">📅</span>
      <span class="nav-label">穿搭</span>
    </button>
    <button class="nav-btn" data-tab="recommend">
      <span class="nav-icon">💌</span>
      <span class="nav-label">推荐</span>
      <span class="badge" id="recommendBadge" style="display:none">0</span>
    </button>
    <button class="nav-btn" data-tab="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">统计</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <div class="drawer-overlay" id="wardrobeDrawerOverlay">
    <div class="drawer">
      <div class="drawer-header">
        <h3>我的衣柜</h3>
        <button class="close-btn" id="closeDrawer">✕</button>
      </div>
      <div class="drawer-content" id="wardrobeList"></div>
      <div style="padding:12px">
        <button class="btn btn-primary btn-block" id="newWardrobeBtn">+ 新建衣柜</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/github.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
